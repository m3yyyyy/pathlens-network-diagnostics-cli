name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.output }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: pathlens.exe
            output: pathlens-windows-amd64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: pathlens
            output: pathlens-linux-amd64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: pathlens
            output: pathlens-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: pathlens
            output: pathlens-macos-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Rust target
        run: rustup toolchain install 1.90.0 --profile minimal --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.output }}"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create checksum file
        run: cd dist && sha256sum pathlens-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "PathLens ${GITHUB_REF_NAME}"
