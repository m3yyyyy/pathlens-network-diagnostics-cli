[package]
name = "pathlens"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Concurrent, safety-focused network reliability diagnostics CLI"
license = "MIT"
repository = "https://github.com/m3yyyyy/pathlens-network-diagnostics-cli"
readme = "README.md"
keywords = ["networking", "diagnostics", "cli", "reliability", "rust"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
url = { version = "2.5", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
